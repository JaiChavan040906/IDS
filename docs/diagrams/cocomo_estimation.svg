<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1340" viewBox="0 0 1500 1340" font-family="Arial, Helvetica, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f3a46"/></marker><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L11,6 L0,12" fill="none" stroke="#2f3a46" stroke-width="1.5"/></marker><marker id="tri" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L13,7 L0,14 z" fill="#fff" stroke="#2f3a46" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="750.0" y="48.4" font-size="24" font-weight="700" text-anchor="middle" fill="#1b1f24">COCOMO Estimation: Sentinel HITL IDS</text><text x="750" y="76.9" font-size="14" font-weight="400" text-anchor="middle" fill="#5b6470">COnstructive COst MOdel (Boehm, 1981): estimates effort, duration and team size from program size</text><rect x="40" y="100" width="1420" height="92" rx="10" fill="#e8f0fb" stroke="#1f5fad" stroke-width="1.6"/><text x="70" y="133.25" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f24">Project size (KLOC = thousands of delivered source lines, blank lines and comments excluded)</text><text x="70" y="165.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">Backend Python 3,534 + scripts 1,256 + React frontend 2,947 = 7,737 lines  →  KLOC = 7.737     (549 test lines not counted)</text><rect x="40" y="210" width="690" height="250" rx="10" fill="#fff" stroke="#2f3a46" stroke-width="1.6"/><text x="70" y="243.95" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24">Basic COCOMO formulas</text><text x="70" y="278" font-size="16" font-family="Consolas, monospace" fill="#1b1f24" xml:space="preserve">Effort      E = a × (KLOC)^b          person-months (PM)</text><text x="70" y="312" font-size="16" font-family="Consolas, monospace" fill="#1b1f24" xml:space="preserve">Duration    D = c × (E)^d             months</text><text x="70" y="346" font-size="16" font-family="Consolas, monospace" fill="#1b1f24" xml:space="preserve">People      P = E / D                 average team size</text><text x="70" y="380" font-size="16" font-family="Consolas, monospace" fill="#1b1f24" xml:space="preserve">Productivity    = LOC / E             lines per person-month</text><text x="70" y="434.9" font-size="14" font-weight="400" text-anchor="start" fill="#5b6470">Intermediate COCOMO:  E = a × (KLOC)^b × EAF   (EAF = product of 15 cost-driver multipliers)</text><rect x="770" y="210" width="690" height="250" rx="10" fill="#fff" stroke="#2f3a46" stroke-width="1.6"/><text x="800" y="243.95" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24">Coefficients by project type</text><text x="800" y="279.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">Type</text><text x="970" y="279.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">a</text><text x="1050" y="279.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">b</text><text x="1130" y="279.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">c</text><text x="1210" y="279.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">d</text><text x="1290" y="279.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">a (intermed.)</text><line x1="800" y1="288" x2="1430" y2="288" stroke="#2f3a46"/><text x="800" y="323.25" font-size="15" font-weight="700" text-anchor="start" fill="#1b1f24">Organic</text><text x="970" y="323.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">2.4</text><text x="1050" y="323.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">1.05</text><text x="1130" y="323.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">2.5</text><text x="1210" y="323.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">0.38</text><text x="1290" y="323.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">3.2</text><text x="800" y="357.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">Semi-detached</text><text x="970" y="357.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">3.0</text><text x="1050" y="357.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">1.12</text><text x="1130" y="357.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">2.5</text><text x="1210" y="357.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">0.35</text><text x="1290" y="357.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">3.0</text><text x="800" y="391.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">Embedded</text><text x="970" y="391.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">3.6</text><text x="1050" y="391.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">1.2</text><text x="1130" y="391.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">2.5</text><text x="1210" y="391.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">0.32</text><text x="1290" y="391.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">2.8</text><text x="800" y="434.55" font-size="13" font-weight="400" text-anchor="start" fill="#5b6470">Organic: small team, familiar problem · Semi-detached: mixed · Embedded: tight constraints</text><rect x="40" y="480" width="1420" height="250" rx="10" fill="#e9f7ee" stroke="#15803d" stroke-width="1.6"/><text x="70" y="515.95" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24">Our project, Basic COCOMO in ORGANIC mode (2-person student team, well-understood tools)</text><text x="70" y="552" font-size="17" font-family="Consolas, monospace" fill="#1b1f24" xml:space="preserve">E = 2.4 × (7.737)^1.05 = 2.4 × 8.570 = 20.57 person-months</text><text x="70" y="588" font-size="17" font-family="Consolas, monospace" fill="#1b1f24" xml:space="preserve">D = 2.5 × (20.57)^0.38 = 7.89 months</text><text x="70" y="624" font-size="17" font-family="Consolas, monospace" fill="#1b1f24" xml:space="preserve">P = 20.57 / 7.89 = 2.61  ≈ 3 people</text><text x="70" y="660" font-size="17" font-family="Consolas, monospace" fill="#1b1f24" xml:space="preserve">Productivity = 7,737 / 20.57 ≈ 376 LOC per person-month</text><text x="900" y="600.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">Reading it: about 21 person-months of work,</text><text x="900" y="627.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">i.e. ~3 people for ~8 months. Our 2-person team</text><text x="900" y="654.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">fits this, given the model and data work were</text><text x="900" y="681.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">spread over the semester.</text><rect x="40" y="750" width="690" height="310" rx="10" fill="#fff" stroke="#2f3a46" stroke-width="1.6"/><text x="70" y="785.95" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24">Effort by project type (person-months)</text><text x="70" y="843.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">Organic</text><rect x="210" y="820" width="142.23970709566296" height="34" rx="4" fill="#15803d" stroke="#15803d" stroke-width="1.6"/><text x="362.239707095663" y="842.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">20.6 PM · 7.9 mo · 2.6 people</text><text x="70" y="917.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">Semi-detached</text><rect x="210" y="894" width="205.17807178520178" height="34" rx="4" fill="#c98500" stroke="#c98500" stroke-width="1.6"/><text x="425.1780717852018" y="916.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">29.7 PM · 8.2 mo · 3.6 people</text><text x="70" y="991.25" font-size="15" font-weight="400" text-anchor="start" fill="#1b1f24">Embedded</text><rect x="210" y="968" width="290.0" height="34" rx="4" fill="#c2410c" stroke="#c2410c" stroke-width="1.6"/><text x="510.0" y="990.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">41.9 PM · 8.3 mo · 5.1 people</text><text x="70" y="1044.55" font-size="13" font-weight="400" text-anchor="start" fill="#5b6470">Same 7.7 KLOC: the stricter the project type, the more effort.</text><rect x="770" y="750" width="690" height="310" rx="10" fill="#fff" stroke="#2f3a46" stroke-width="1.6"/><text x="800" y="785.95" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24">Intermediate COCOMO (organic, a = 3.2), cost drivers</text><text x="800" y="819.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">RELY</text><text x="870" y="819.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Required reliability</text><text x="1120" y="819.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">High</text><text x="1200" y="819.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">1.15</text><text x="800" y="846.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">DATA</text><text x="870" y="846.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Database size</text><text x="1120" y="846.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">High</text><text x="1200" y="846.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">1.08</text><text x="800" y="873.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">CPLX</text><text x="870" y="873.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Product complexity</text><text x="1120" y="873.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">High</text><text x="1200" y="873.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">1.15</text><text x="800" y="900.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">VIRT</text><text x="870" y="900.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Platform volatility</text><text x="1120" y="900.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Low</text><text x="1200" y="900.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">0.87</text><text x="800" y="927.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">AEXP</text><text x="870" y="927.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Application experience</text><text x="1120" y="927.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Low</text><text x="1200" y="927.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">1.13</text><text x="800" y="954.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">MODP</text><text x="870" y="954.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Modern practices</text><text x="1120" y="954.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">High</text><text x="1200" y="954.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">0.91</text><text x="800" y="981.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">TOOL</text><text x="870" y="981.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Software tools</text><text x="1120" y="981.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">High</text><text x="1200" y="981.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">0.91</text><text x="800" y="1016.55" font-size="13" font-weight="400" text-anchor="start" fill="#5b6470">Other 8 drivers Nominal (1.00).</text><text x="800" y="1044.9" font-size="14" font-weight="700" text-anchor="start" fill="#1b1f24">EAF = 1.163   →   E = 3.2 × 8.570 × 1.163 = 31.9 PM,   D = 9.3 months</text><rect x="40" y="1080" width="1420" height="230" rx="10" fill="#f4f6f8" stroke="#2f3a46" stroke-width="1.6"/><text x="70" y="1115.95" font-size="17" font-weight="700" text-anchor="start" fill="#1b1f24">Why these ratings</text><text x="70" y="1149.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">RELY High: a missed attack or wrong deployment is costly, hence the human review and gated retraining.</text><text x="70" y="1181.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">DATA High: 1.7 million flows (about 1 GB raw).    CPLX High: deep learning + uncertainty routing + full web portal.</text><text x="70" y="1213.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">AEXP Low: first intrusion-detection project for the team.    VIRT Low: stable Python / PyTorch / React stack.</text><text x="70" y="1245.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">MODP, TOOL High: version control, automated tests (23), modern libraries and IDE.</text><text x="70" y="1277.9" font-size="14" font-weight="400" text-anchor="start" fill="#1b1f24">Values are estimates for the report; COCOMO predicts typical industry effort, not our actual hours.</text></svg>